name: "CI"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  composer:
    name: "composer config validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@v4"

      - name: "composer validate"
        run: "composer validate --strict"

  php:
    name: "PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
        dependencies:
          - "default"
        include:
          - php-version: "8.1"
            dependencies: "lowest"

    steps:
      - name: "git checkout"
        uses: "actions/checkout@v4"

      - name: "setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"

      - name: "install composer dependencies (default)"
        if: "matrix.dependencies == 'default'"
        run: "composer install --prefer-dist --no-progress --no-interaction"

      - name: "install composer dependencies (lowest)"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --prefer-lowest --prefer-dist --no-progress --no-interaction"

      - name: "composer audit (default)"
        if: "matrix.php-version == '8.1' && matrix.dependencies == 'default'"
        run: "composer audit --no-interaction"

      - name: "composer audit (lowest)"
        if: "matrix.php-version == '8.1' && matrix.dependencies == 'lowest'"
        run: "composer audit --no-interaction"

      - name: "lint PHP files"
        run: "find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: "PHP_CodeSniffer"
        run: "php vendor/bin/phpcs"

      - name: "Run phpunit"
        run: "php vendor/bin/phpunit --colors=never"

